# Builds Voiceclone Studio from the private agungkes/wfr-qa repo and publishes it here.
# The source is only checked out on the runner; it is never committed to this repo.
# Started by a tag push in wfr-qa (repository_dispatch), or by hand with a tag name.
# No pull_request trigger: fork PRs must never run here or read the build cache.
name: Release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag in agungkes/wfr-qa to build, e.g. v0.2.0
        required: true

concurrency: release

jobs:
  macos:
    # Separate Apple Silicon and Intel builds; both jobs add their platform to one latest.json.
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - name: Check tag format
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $TAG"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          repository: agungkes/wfr-qa
          ref: refs/tags/${{ env.TAG }}
          # Fine-grained token: Contents read on wfr-qa.
          token: ${{ secrets.CODE_REPO_TOKEN }}
          persist-credentials: false

      - name: Check tag matches app version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match app version $version"; exit 1; }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: agungkes
          repo: wfr-qa-release
          # The checked-out commit belongs to wfr-qa, so tag this repo's own branch.
          releaseCommitish: main
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: Voiceclone Studio v__VERSION__
          releaseDraft: false
